  docs:
    name: Documentation (Starlight)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skips on the nightly run, and on a pull request that
    # touches none of the areas `go`, `docs`, `changes` and `removed`.
    # ADR-20260923-xcq rule 1 says why.
    needs: [ changes ]
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.changes == 'true' || needs.changes.outputs.removed == 'true') }}

    defaults:
      run:
        working-directory: ./docs

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        # a check that compares against a base needs the history to find one.
        fetch-depth: 0

    # `pnpm run build` below triggers docs/package.json's prebuild, which
    # renders the two AsyncAPI reference pages from the committed captures. No
    # Go runs there, so the token is wired up defensively but not required: this
    # job must keep working on fork PRs, which GitHub never gives repository
    # secrets to.
    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        cache: false

    # The packages `Backend / Go build cache` compiled, today's or the newest
    # before it. Go rebuilds only what changed since.
    - name: Restore the Go build cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-shared-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ github.run_id }}
        restore-keys: go-shared-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-

    - name: Set up pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        package_json_file: docs/package.json

    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: .nvmrc
        cache: 'pnpm'
        cache-dependency-path: docs/pnpm-lock.yaml

    - name: Install docs dependencies
      run: pnpm install --frozen-lockfile

    - name: Build documentation
      id: build
      run: pnpm run build

    # The documentation gates, run as the gates and not as their parts.
    #
    # Calling docs/scripts/check-links.mjs and check-table-regions.mjs from here
    # is a second implementation of this target, and it leaves the three shell
    # gates running in no job. Two of their refusals are why that matters.
    # check-docs-site.sh deletes docs/dist before it builds, because a route
    # deleted from the content tree keeps its index.html and a link to it still
    # resolves. Both scripts refuse a missing toolchain rather than degrading to
    # a warning.
    #
    # .githooks/pre-push states the principle: a clone that never ran
    # `make install-hooks` pushes with no hook, which is why CI runs the same
    # target. internal/arch's TestEveryGateScriptRunsInACIJob keeps it wired.
    - name: Run the documentation gates
      if: ${{ !cancelled() }}
      working-directory: .
      run: make docs-check

    # prebuild regenerates the AsyncAPI reference pages. Without this check a
    # generator change and the committed pages drift apart silently, which is
    # the hole the error code gates close for their own artefacts.
    - name: Verify the generated reference pages are up to date
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        if ! git diff --exit-code -- src/content/docs/mqtt-asyncapi.mdx src/content/docs/sse-asyncapi.mdx; then
          echo "The AsyncAPI reference pages differ from what the generator emits."
          echo "Run 'pnpm run generate:protocol-reference-pages' in docs/ and commit the result."
          exit 1
        fi

    - name: Upload docs artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: docs-dist
        path: docs/dist
        retention-days: 7

  # ---------------------------------------------------------------------------
  # The compiled packages every other Go job starts from.
  #
  # On a runner's two processors compiling is most of a Go job: the three
  # parts of internal/app each test for about a minute in a job of over three.
  # setup-go keeps one cache entry per go.sum, written by whichever job of the
  # first run with that go.sum finished first, so it held the dependencies and
  # little of this module. This job compiles what the Go jobs compile
  # (`make go-cache-warm`) and a push to main writes the result once a day.
  # Every Go job restores the newest entry and rebuilds what changed since.
  # The job runs on every event, as CI OK reads it, and its steps on a push to
  # main alone: on a pull request it would compile what nobody saves, on one
  # of the twenty runners the organisation may hold at once.
  # ---------------------------------------------------------------------------
  backend-go-cache:
    name: Backend / Go build cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ changes ]
    if: github.event_name != 'schedule'

    steps:
    - name: Checkout code
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Go
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      id: setup-go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Name today's entry
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      id: day
      run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

    - name: Restore the Go build cache
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-shared-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.day.outputs.day }}
        restore-keys: go-shared-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-

    - name: Compile what the Go jobs compile
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      run: make go-cache-warm

    - name: Save the Go build cache
      if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ steps.restore.outputs.cache-primary-key }}

  # ---------------------------------------------------------------------------
  # The one result for the whole run.
  #
  # It runs under always(), because a skipped result job reads as a pass. It
  # waits for every job above and fails when the run was cancelled, or when
  # any of them failed or was cancelled. A skipped job fails it too, unless the
  # event or `CI / What the change touches` explains the skip.
  # internal/arch/ci_ok_test.go holds each job's `if` to the condition the
  # script below reads for it, and refuses a job that is missing from `needs`.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - changes
      - repo-gates
      - backend-lint
      - backend-go-cache
      - backend-security
      - backend-verify
      - backend-error-codes
      - backend-matrix
      - backend-unit
      - backend-unit-nodb
      - backend-unit-sdk
      - backend-unit-minimal
      - backend-unit-printer
      - backend-race
      - backend-race-nodb
      - backend-race-modules
      - backend-adapters
      - backend-client-install
      - backend-build
      - docker-image
      - web-client
      - web-client-lint
      - web-client-test
      - web-app
      - web-embedded
      - web-examples
      - web-journey
      - web-oidc-providers
      - docs

    steps:
    - name: Print the result of every job
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: printf '%s\n' "$NEEDS"

    # GitHub allows cancelled() only in an if, so a cancelled run is failed by
    # a step of its own.
    - name: Fail when the run was cancelled
      if: cancelled()
      run: |
        echo "::error::the run was cancelled, so it did not check this commit"
        exit 1

    # A race job runs on the nightly schedule and on a push to main.
    # `CI / What the change touches` runs on every event. A job that skips for
    # the paths runs on every event but the nightly one, and on a pull request
    # only when one of its areas changed. The sign-in at the providers runs on
    # the nightly event too. Every other job runs on every event except the
    # nightly one. Any result but success fails, and so does a skip the event
    # and the areas do not explain. An area the paths job did not answer
    # counts as changed.
    # internal/arch/ci_ok_script_test.go runs this script, and
    # internal/arch/ci_ok_test.go holds each case to the job's condition.
    - name: Fail when a job failed, was cancelled or skipped without reason
      env:
        NEEDS: ${{ toJSON(needs) }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        pull_request=false
        race_runs=false
        others_run=true
        case "$EVENT" in
          pull_request) pull_request=true ;;
          schedule) race_runs=true; others_run=false ;;
        esac
        if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
          race_runs=true
        fi
        # touched AREA... succeeds unless the paths job answered false for
        # every area it names.
        touched() {
          local area
          for area in "$@"; do
            if [ "$(jq -r --arg area "$area" '.changes.outputs[$area] // ""' <<<"$NEEDS")" != false ]; then
              return 0
            fi
          done
          return 1
        }
        # gated AREA... prints whether a job that skips for the paths had to
        # run. gated_with_nightly is the same for a job the nightly run starts.
        gated() {
          if [ "$pull_request" = true ] && ! touched "$@"; then
            echo false
          else
            echo "$others_run"
          fi
        }
        gated_with_nightly() {
          if [ "$pull_request" = true ] && ! touched "$@"; then
            echo false
          else
            echo true
          fi
        }
        jobs=$(jq -r 'keys[]' <<<"$NEEDS")
        failed=0
        for job in $jobs; do
          result=$(jq -r --arg job "$job" '.[$job].result' <<<"$NEEDS")
          case "$job" in
            backend-race*) expected=$race_runs ;;
            changes) expected=true ;;
            web-oidc-providers) expected=$(gated_with_nightly sign_in) ;;
            backend-lint|backend-security|backend-error-codes|backend-matrix|backend-build) expected=$(gated go) ;;
            backend-unit|backend-unit-nodb|backend-unit-sdk|backend-unit-minimal|backend-unit-printer) expected=$(gated go) ;;
            backend-adapters) expected=$(gated go) ;;
            backend-verify) expected=$(gated go docs) ;;
            backend-client-install|docker-image|web-client) expected=$(gated go web) ;;
            web-embedded|web-examples|web-journey) expected=$(gated go web) ;;
            web-client-lint|web-client-test|web-app) expected=$(gated web) ;;
            docs) expected=$(gated go docs changes removed) ;;
            *) expected=$others_run ;;
          esac
          if [ "$result" = success ]; then
            continue
          fi
          if [ "$result" = skipped ] && [ "$expected" = false ]; then
            continue
          fi
          echo "::error::$job ended as $result"
          failed=1
        done
        exit "$failed"
