name: Fork Docker Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional source branch, tag or commit (empty = sync Prusa + RTSP fix)"
        required: false
        type: string
      publish_latest:
        description: "Also update the Docker latest tag"
        type: boolean
        default: true
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/fork-docker-release.yml'

permissions:
  contents: read

concurrency:
  group: fork-docker-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'LeDomme/prusa-connect' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - name: Checkout managed RTSP source branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: custom/rtsp-camera
          fetch-depth: 0
          persist-credentials: true

      - name: Sync upstream and select source
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_REF" ]; then
            # Resolve only a commit already reachable in this repository.
            REVISION=$(git rev-parse --verify --end-of-options "$SOURCE_REF^{commit}" 2>/dev/null || git rev-parse --verify --end-of-options "origin/$SOURCE_REF^{commit}")
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git fetch --no-tags https://github.com/prusa3d/prusa-connect.git refs/heads/main
            UPSTREAM=$(git rev-parse FETCH_HEAD)
            if ! git merge-base --is-ancestor "$UPSTREAM" HEAD; then
              # Keep the fork's existing Actions files: GITHUB_TOKEN cannot
              # update workflow definitions. The product source is merged normally.
              git merge --no-commit --no-ff "$UPSTREAM" || {
                git rev-parse --verify MERGE_HEAD >/dev/null || exit 1
              }
              git restore --source=HEAD --staged --worktree -- .github/workflows
              if [ -n "$(git ls-files -u)" ]; then
                echo "::error::Upstream merge conflicts; resolve on custom/rtsp-camera before publishing."
                git diff --name-only --diff-filter=U
                git merge --abort
                exit 1
              fi
              git commit -m "Merge Prusa upstream $UPSTREAM into RTSP build"
              git push origin HEAD:refs/heads/custom/rtsp-camera
            fi
            REVISION=$(git rev-parse HEAD)
          fi
          BASE=$(git show "$REVISION:VERSION" | tr -d '[:space:]')
          DATE=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d "$REVISION")
          SHORT=$(git rev-parse --short=12 "$REVISION")
          VERSION="$BASE-dev.$DATE.$SHORT"
          BUILD=true
          if [ "$EVENT" != workflow_dispatch ]; then
            # Fail closed on API errors, rather than silently rebuilding.
            TAGS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
            if grep -Fxq "v$VERSION" <<< "$TAGS"; then
              BUILD=false
              echo "::notice::Source $REVISION already has a release."
            fi
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.sync.outputs.revision }}
          persist-credentials: false

      - name: Prepare version and image metadata
        id: meta
        run: |
          set -eu
          REVISION=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short=12 HEAD)
          BASE=$(tr -d '[:space:]' < VERSION)
          DATE=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD)
          VERSION="$BASE-dev.$DATE.$SHORT"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.-]*$ ]]
          {
            echo "version=$VERSION"
            echo "revision=$REVISION"
            echo "image=$IMAGE"
            echo "tags<<TAGS"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:sha-$REVISION"
            echo "TAGS"
            echo "build_args<<ARGS"
            echo "GO_VERSION=$(awk '/^go / {print $2; exit}' go.mod)"
            echo "BUILD_VERSION=$VERSION"
            echo "EXTRA_BUILD_TAGS=diagnostics observability postgres"
            echo "ARGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build AMD64 image for tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: prusa-connect:release
          build-args: ${{ steps.meta.outputs.build_args }}

      - name: Run upstream container checks
        run: |
          set -eu
          bash scripts/check-container-nonroot.sh prusa-connect:release
          bash scripts/check-container-probes.sh prusa-connect:release
          bash scripts/check-container-privileged-port.sh prusa-connect:release

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ steps.meta.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.description=Unofficial development build based on Prusa Connect by Prusa Research
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532

      - name: Sign published image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Update latest after successful signing
        if: github.event_name != 'workflow_dispatch' || inputs.publish_latest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish unofficial GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          REVISION: ${{ needs.build.outputs.revision }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -eu
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; leaving its notes unchanged."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release.md" <<EOF
          Unofficial development build by LeDomme, based on Prusa Connect by Prusa Research a.s.

          Source commit: $REVISION

          Docker (Linux AMD64 and ARM64):

              docker pull $IMAGE:$VERSION

          Immutable image reference: $IMAGE@$DIGEST

          The upstream AMD64 container checks passed before publication. No standalone binaries are included. This is not an official Prusa release.

          License: OCL v1.1 + Micro v1 + NoSaaS v1 + SWAtt v1 (see LICENSE in source).
          EOF
          gh release create "$TAG" --target "$REVISION" --prerelease --title "Prusa Connect $VERSION (unofficial)" --notes-file "$RUNNER_TEMP/release.md"
